<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="title"></div>

  <!-- Image 1: Tree canopy with O and Y -->
  <div class="image-layer image-1 active" id="image1">
    <!-- O hotspot - center radial pattern -->
   <a href="LetterO/index.html">
      <div class="hotspot" data-letter="O" style="
        width: 350px; height: 350px;
        top: 65%; left: 45%;
        transform: translate(-50%, -50%);
      "></div>
    </a>

    <!-- Y hotspot - left side Y-shaped branch -->
    <a href="LetterY/index.html">
      <div class="hotspot" data-letter="Y" style="
        width: 350px; height: 350px;
        top: 20%; left: 35%;
        transform: translate(-50%, -50%);
      "></div>
    </a>

  
  </div>

  <!-- Image 2: Crossed branches with A and X -->
  <div class="image-layer image-2" id="image2">
    <!-- A hotspot - left side A-shaped formation -->
    <a href="LetterA/index.html">
      <div class="hotspot" data-letter="A" style="
         width: 350px; height: 350px;
        top: 48%; left: 33%;
        transform: translate(-50%, -50%);
      "></div>
    </a>

    <!-- X hotspot - center X-shaped crossed branches -->
    <a href="LetterX/index.html">
      <div class="hotspot" data-letter="X" style="
        width: 350px; height: 350px;
        top: 62%; left: 65%;
        transform: translate(-50%, -50%);
      "></div>
    </a>
  </div>

  

  <!-- Discovery hint - appears after 10 seconds -->
  <div class="discovery-hint" id="discoveryHint">
    <p>Look closer! Click where the branches feel densest.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
